name: SEO hebdo

# Routine SEO hebdomadaire d'Opti-CDS.
#
# Ce workflow NE DÉPLOIE PAS. C'est délibéré : le déploiement depuis un état
# git incomplet est exactement ce qui a fait disparaître des pages de la
# production par le passé. Ici on construit depuis git, on contrôle, et on
# rapporte dans une issue GitHub — un canal qui atteint réellement quelqu'un,
# contrairement à une session que personne ne lit.
#
# Il échoue si l'audit remonte du BLOQUANT (404 interne, title manquant,
# JSX fuité...). La DETTE (articles courts, sans lien interne) n'échoue pas :
# elle est suivie dans l'issue et doit décroître semaine après semaine.

on:
  schedule:
    - cron: "23 7 * * 1"   # lundi 07:23 UTC
  workflow_dispatch: {}
  # Rejoue aussi l'audit dès que le contenu ou l'outillage change, pour ne pas
  # découvrir une régression une semaine plus tard.
  push:
    paths:
      - "content/**"
      - "app/**"
      - "lib/seo.ts"
      - "scripts/seo-audit.mjs"
      - ".github/workflows/seo-weekly.yml"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Audit SEO (lisible)
        id: audit
        continue-on-error: true
        run: node scripts/seo-audit.mjs

      - name: Audit SEO (json)
        if: always()
        run: node scripts/seo-audit.mjs --json > audit.json

      - name: Rapport dans l'issue de suivi
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const MARK = '<!-- seo-audit-tracker -->';
            const stamp = new Date().toISOString().slice(0, 10);

            const short = a.shortestArticles
              .map(s => `| ${s.words} | ${s.route} |`).join('\n');
            const blk = a.blocking
              ? a.blockingDetail.map(b => `- \`${b.code}\` ${b.page} — ${b.msg}`).join('\n')
              : '_Aucun._';
            const debtLines = Object.entries(a.debtByCode)
              .map(([k, v]) => `- **${k}** : ${v}`).join('\n') || '_Aucune._';

            const body = [
              MARK,
              `# État SEO du corpus — ${stamp}`,
              '',
              `**${a.pages} pages** contrôlées · **${a.blocking} bloquant(s)** · **${a.debt} point(s) de dette**`,
              '',
              '## Bloquant (interdit en production)',
              blk,
              '',
              '## Dette à résorber',
              debtLines,
              '',
              '## Articles les plus courts (à étoffer en priorité)',
              '',
              '| Mots | Article |',
              '|---:|---|',
              short,
              '',
              '---',
              '_Mis à jour automatiquement par le workflow `SEO hebdo`. La dette doit décroître chaque semaine._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:body "seo-audit-tracker"`,
            });
            const existing = found.data.items.find(i => i.body && i.body.includes(MARK));

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Issue #${existing.number} mise à jour.`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: 'SEO — état du corpus', body,
              });
              core.info(`Issue #${created.data.number} créée.`);
            }

      - name: Échouer si bloquant
        if: steps.audit.outcome == 'failure'
        run: |
          echo "L'audit a remonté des erreurs bloquantes. Voir l'issue de suivi."
          exit 1
